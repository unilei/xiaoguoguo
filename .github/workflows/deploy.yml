name: Build & Deploy

# push 到 main 就构建镜像并滚动到服务器；也可以在 Actions 页面手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支只保留最新一次部署，避免两个 workflow 同时 up -d 打架
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像 tag
        id: vars
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # sha-<commit> 用于回滚，latest 只作兜底
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH 拉取并重启
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # 端口直连方案不需要 nginx，部署目录与镜像 tag 都在 /opt/xiaoguoguo
          script: |
            set -euo pipefail
            cd /opt/xiaoguoguo

            TAG="${{ needs.build.outputs.tag }}"
            echo "部署镜像：$TAG"

            # 写 .env 让 compose 读到版本；.image-tag 留一份人可读记录，回滚时直接改它
            echo "IMAGE_VERSION=$TAG" > .env
            echo "$TAG" > .image-tag

            docker compose pull
            docker compose up -d --remove-orphans

            # 等健康检查通过再算成功，避免 CI 绿了但容器起不来
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' xiaoguoguo-web 2>/dev/null || echo "missing")
              if [ "$status" = "healthy" ]; then
                echo "容器健康检查通过"
                break
              fi
              if [ "$status" = "unhealthy" ]; then
                echo "容器 unhealthy，最近日志："
                docker logs --tail 40 xiaoguoguo-web
                exit 1
              fi
              if [ "$status" = "missing" ]; then
                echo "容器不存在，启动失败"
                docker compose logs --tail 40
                exit 1
              fi
              sleep 2
            done

            docker image prune -f
            docker compose ps
            curl -fsS http://127.0.0.1:8788/api/health && echo
